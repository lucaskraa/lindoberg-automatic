<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alura Auto 4.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version {
      font-size: 11px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
    }
    .badge {
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.3px;
    }
    .badge-ok {
      background: #065f46;
      color: #34d399;
    }
    .badge-warn {
      background: #78350f;
      color: #fbbf24;
    }
    .badge-danger {
      background: #7f1d1d;
      color: #f87171;
    }
    .course-info {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .course-name {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lesson-name {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡</span> ALURA AUTO
    </div>
    <span class="version">v4.0.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="label">Extensão:</span>
      <span id="extStatus" class="badge badge-ok">CONECTADA</span>
    </div>
    <div class="status-row">
      <span class="label">Aba Alura:</span>
      <span id="aluraStatus" class="badge badge-warn">BUSCANDO...</span>
    </div>
    <div class="status-row">
      <span class="label">Automação:</span>
      <span id="autoStatus" class="badge badge-secondary">PARADO</span>
    </div>
  </div>

  <div class="course-info">
    <div class="label" style="margin-bottom: 4px; font-size: 10px;">CURSO E AULA ATUAL:</div>
    <div id="courseTitle" class="course-name">Nenhum curso detectado</div>
    <div id="lessonTitle" class="lesson-name">Abra uma aula na Alura</div>
  </div>

  <div class="btn-group">
    <button id="toggleBtn" class="btn-primary">COMEÇAR AUTOMAÇÃO</button>
    <button id="openDashboardBtn" class="btn-secondary">ABRIR PAINEL COMPLETO</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
